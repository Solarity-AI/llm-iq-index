name: Site

# Refreshes scores from Artificial Analysis, lands them on main through a pull request it opens and merges, and deploys
# the site to GitHub Pages. Manual runs only (Actions > Site > Run workflow, or gh workflow run site.yml); the old
# 3-hourly schedule and push trigger were removed under the org CI rules. Pull request tests live in ci.yml.
on:
  workflow_dispatch:

concurrency:
  group: site-main
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }

      # A failed or refused refresh never blocks a deploy: the site keeps its last good data.
      - name: Refresh scores from Artificial Analysis
        id: update
        continue-on-error: true
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: |
          set -o pipefail
          npm run update --silent 2>&1 | tee update.log
          echo "pending=$(grep '^PENDING: ' update.log | sed 's/^PENDING: //')" >> "$GITHUB_OUTPUT"
          echo "refused=$(grep '^REFUSED: ' update.log | sed 's/^REFUSED: //')" >> "$GITHUB_OUTPUT"

      - name: Discard a partial refresh
        if: steps.update.outcome == 'failure'
        run: |
          git checkout -- data/models.json
          echo "::warning::Data refresh failed; deploying the last good data. $(tail -1 update.log)"

      - name: Flag a refused or failed refresh
        if: steps.update.outcome == 'failure' || steps.update.outputs.refused != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.update.outputs.refused || 'the refresh step failed; see the run log' }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Data refresh needs attention"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -z "$n" ]; then gh issue create --title "$title" --body "The scheduled data refresh did not update the site: ${REASON}. The site keeps showing the last good data. Run: ${RUN}"; fi

      - run: npm run build --silent
      - run: npm test

      # main accepts changes only through pull requests: push a branch, open a pull request and squash-merge it.
      - name: Commit refreshed data through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if git diff --quiet -- data/models.json data.js index.html; then echo "No data changes."; exit 0; fi
          git config user.name "llm-iq-index bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="data/refresh-${GITHUB_RUN_ID}"
          title="chore(data): refresh scores from Artificial Analysis"
          git switch -c "$branch"
          git add data/models.json data.js index.html
          git commit -m "$title"
          git push origin "$branch"
          body="Automated data refresh by the Site workflow: ${RUN}"
          if ! url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "$title" --body "$body"); then
            # The org setting "Allow GitHub Actions to create and approve pull requests" is off: push directly
            # instead (this fails once a ruleset requires pull requests on main).
            echo "::warning::Could not open a pull request; pushing the data to main directly."
            git push origin --delete "$branch"
            for i in 1 2 3; do git push origin HEAD:main && exit 0; git pull --rebase origin main || exit 1; done
            exit 1
          fi
          # Mergeability may still be computing right after creation, or main may have moved: retry briefly.
          for i in 1 2 3 4 5 6; do
            gh pr merge "$url" --repo "$GITHUB_REPOSITORY" --squash --delete-branch && exit 0
            sleep 10
          done
          exit 1

      - name: Flag models that need classifying
        if: steps.update.outputs.pending != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PENDING: ${{ steps.update.outputs.pending }}
        run: |
          title="New models need open/closed classification"
          body="The data refresh found models it could not classify as open or closed: ${PENDING}. Add a rule in scripts/update-from-aa.mjs or set their type in data/models.json."
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue view "$n" --json body,comments --jq '.body, .comments[].body' | grep -qF "$PENDING" || gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html app.js data.js fonts.css og.png robots.txt sitemap.xml _site/
          cp -r fonts _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
